version: 2
updates:
  # The website's npm dependencies. Nothing here reaches a Go module.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive together. A major version gets its own
      # pull request, so it is reviewed as the breaking change it may be
      # (PR 120 put TypeScript 5 to 7 in the catch-all group).
      site:
        patterns: ["*"]
        update-types: [minor, patch]
  # Go modules with third-party dependencies. The root module has none (P7).
  # Grouped per module so one pull request carries a module's minor and patch
  # updates; a major version gets its own.
  - package-ecosystem: gomod
    directories: [/caddy, /store/valkey, /observe/prom, /bench/compare]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  # Actions are pinned by commit; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
