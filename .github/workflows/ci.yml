name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D42: the two latest Go releases at or above the go.mod minimum. Only
        # 1.27 exists today; add the next release here when it ships.
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: make check
        run: make check
      - name: govulncheck
        run: make vuln

  # P2-01c: catches Caddy API drift (docs/08 §9). The root `replace` is needed
  # because no root tag exists yet; drop it once one does.
  # xcaddy resolves the latest Caddy on purpose: a red build here means Caddy
  # moved under the module, which is the drift this job exists to catch.
  caddy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: caddy/go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: xcaddy build
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          xcaddy build \
            --with github.com/AshwinSathian/weir=. \
            --with github.com/AshwinSathian/weir/caddy=./caddy \
            --output ./caddy-weir
      - name: start with a minimal Caddyfile
        run: |
          cat > Caddyfile.ci <<'EOF'
          {
          	admin localhost:2999
          	auto_https off
          }
          :8099 {
          	route {
          		weir {
          			name ci
          		}
          		respond "ok"
          	}
          }
          EOF
          ./caddy-weir validate --config Caddyfile.ci --adapter caddyfile
          ./caddy-weir run --config Caddyfile.ci --adapter caddyfile >caddy.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8099/ | grep -qx ok; then exit 0; fi
            sleep 1
          done
          echo "caddy did not serve the minimal Caddyfile" >&2
          cat caddy.log >&2
          exit 1

  # Keeps a stable required-check name (`check`) however many Go versions the
  # matrix holds.
  check:
    if: always()
    needs: [check-go, caddy-build]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check-go.result }}" = success -a "${{ needs.caddy-build.result }}" = success
