name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D42: the two latest Go releases at or above the go.mod minimum. Only
        # 1.27 exists today; add the next release here when it ships.
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: make check
        run: make check
      - name: govulncheck
        run: make vuln

  # P2-01c: catches Caddy API drift (docs/08 §9). The pinned entry is the
  # required gate (v2.11.7, the version docs/08 §7 and §11 were verified
  # against). The `latest` entry reports drift without blocking unrelated PRs
  # when Caddy ships a release: it is allowed to fail.
  # The root `replace` (`=.`) stays because the v0.1.0 root tag predates the
  # APIs caddy/ uses; flip to the tag once a newer one exists, so the job
  # also tests the path real users take.
  caddy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.caddy == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        caddy: ["v2.11.7", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: caddy/go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: xcaddy build
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          xcaddy build ${{ matrix.caddy }} \
            --with github.com/AshwinSathian/weir=. \
            --with github.com/AshwinSathian/weir/caddy=./caddy \
            --with github.com/AshwinSathian/weir/observe/prom=./observe/prom \
            --output ./caddy-weir
      - name: start with a minimal Caddyfile
        run: |
          cat > Caddyfile.ci <<'EOF'
          {
          	admin localhost:2999
          	auto_https off
          }
          :8099 {
          	route {
          		weir {
          			name ci
          		}
          		respond "ok"
          	}
          }
          EOF
          ./caddy-weir validate --config Caddyfile.ci --adapter caddyfile
          ./caddy-weir run --config Caddyfile.ci --adapter caddyfile >caddy.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8099/ 2>/dev/null | grep -qx ok; then
              kill -0 $pid || { echo "caddy exited after serving" >&2; cat caddy.log >&2; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "caddy did not serve the minimal Caddyfile" >&2
          cat caddy.log >&2
          exit 1

  # P25-02: the Valkey store against a real server. Not multiplied by the Go
  # version matrix. The policy is the one 05 §7 requires; the store refuses
  # allkeys-* on connect. Valkey 7 or later is required.
  valkey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      valkey:
        image: valkey/valkey:8.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: store/valkey/go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: set the eviction policy
        run: |
          docker exec "$(docker ps -q --filter ancestor=valkey/valkey:8.1)" valkey-cli config set maxmemory-policy volatile-lfu
      - name: integration tests
        env:
          WEIR_VALKEY_ADDR: localhost:6379
        run: make test-valkey

  # Keeps a stable required-check name (`check`) however many Go versions the
  # matrix holds.
  check:
    if: always()
    needs: [check-go, caddy-build, valkey]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check-go.result }}" = success -a "${{ needs.caddy-build.result }}" = success -a "${{ needs.valkey.result }}" = success
