name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D42: the two latest Go releases. The go.mod minimum is the older one;
        # when Go 1.28 ships, drop 1.26 here and raise the minimum to 1.27.
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: make check
        run: make check
      # 32-bit: test code with untyped constants over 2^31 compiled only on
      # 64-bit until a vet run here caught it.
      - name: vet on 32-bit
        run: GOARCH=386 go vet ./...
      # The snapshot loader's O_NONBLOCK kept the root module from compiling
      # for wasm until the v1.0.0-rc.1 rehearsal cross-built it.
      - name: vet on wasm
        run: |
          GOOS=js GOARCH=wasm go vet ./...
          GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: govulncheck
        run: make vuln

  # P2-01c: catches Caddy API drift (docs/08 §9). The pinned entry is the
  # required gate (v2.11.7, the version docs/08 §7 and §11 were verified
  # against). The `latest` entry reports drift without blocking unrelated PRs
  # when Caddy ships a release: it is allowed to fail.
  # The `=path` overrides stay: this job tests the working tree. The
  # published tags are built by `caddy-published` below.
  caddy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.caddy == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        caddy: ["v2.11.7", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: xcaddy build
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          xcaddy build ${{ matrix.caddy }} \
            --with github.com/AshwinSathian/weir=. \
            --with github.com/AshwinSathian/weir/caddy=./caddy \
            --with github.com/AshwinSathian/weir/observe/prom=./observe/prom \
            --with github.com/AshwinSathian/weir/store/valkey=./store/valkey \
            --output ./caddy-weir
      - name: start with a minimal Caddyfile
        run: |
          cat > Caddyfile.ci <<'EOF'
          {
          	admin localhost:2999
          	auto_https off
          }
          :8099 {
          	route {
          		weir {
          			name ci
          		}
          		respond "ok"
          	}
          }
          EOF
          ./caddy-weir validate --config Caddyfile.ci --adapter caddyfile
          # P25-07: a Valkey block validates without a server (the store connects lazily).
          cat > Caddyfile.valkey <<'EOF2'
          :8098 {
          	weir {
          		name ci-valkey
          		store valkey {
          			addrs 127.0.0.1:6399
          		}
          	}
          	respond "ok"
          }
          EOF2
          ./caddy-weir validate --config Caddyfile.valkey --adapter caddyfile
          ./caddy-weir run --config Caddyfile.ci --adapter caddyfile >caddy.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8099/ 2>/dev/null | grep -qx ok; then
              kill -0 $pid || { echo "caddy exited after serving" >&2; cat caddy.log >&2; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "caddy did not serve the minimal Caddyfile" >&2
          cat caddy.log >&2
          exit 1

  # docs/release.md step 8: the path users take, the published tags with no
  # =path overrides. Not in the `check` aggregate: a pull request cannot fix
  # a published tag, so a failure here means a new release, not a blocked PR.
  caddy-published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEIR_VERSION: v1.2.0
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: false
      - name: xcaddy build from the module proxy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          xcaddy build v2.11.7 \
            --with github.com/AshwinSathian/weir@$WEIR_VERSION \
            --with github.com/AshwinSathian/weir/caddy@$WEIR_VERSION \
            --output ./caddy-weir
          ./caddy-weir list-modules --versions | tee modules.txt
          test "$(grep -c "weir $WEIR_VERSION" modules.txt)" = 2

  # P25-02: the Valkey store against a real server. Not multiplied by the Go
  # version matrix. The policy is the one 05 §7 requires; the store refuses
  # allkeys-* on connect. Valkey 7 or later is required, so the oldest
  # supported line and the current one are both tested.
  valkey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        valkey: ["7.2", "8.1"]
    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # P25-06: the eviction storm needs a server that runs out of memory.
      valkey-storm:
        image: valkey/valkey:${{ matrix.valkey }}
        ports: ["6380:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: set the eviction policy
        # The service container IDs come from the job context: both services
        # listen on 6379 inside their containers, so a port filter would match
        # both or neither.
        env:
          MAIN_ID: ${{ job.services.valkey.id }}
          STORM_ID: ${{ job.services.valkey-storm.id }}
        run: |
          docker exec "$MAIN_ID" valkey-cli config set maxmemory-policy volatile-lfu
          docker exec "$STORM_ID" valkey-cli config set maxmemory-policy volatile-lfu
          docker exec "$STORM_ID" valkey-cli config set maxmemory 16mb
      # 05 §7 (Replication): HardEpochWait must wait for a replica, and the
      # test pauses it with DEBUG SLEEP, which a service container cannot
      # enable (services take no command), so the replica is started here on
      # the services' network.
      - name: start a replica
        env:
          NET: ${{ job.services.valkey.network }}
          IMAGE: valkey/valkey:${{ matrix.valkey }}
        run: |
          docker run -d --name valkey-replica --network "$NET" -p 6381:6379 "$IMAGE" \
            valkey-server --replicaof valkey 6379 --enable-debug-command yes
          for i in $(seq 30); do docker exec valkey-replica valkey-cli ping && exit 0; sleep 1; done
          exit 1
      - name: integration tests
        env:
          WEIR_VALKEY_ADDR: localhost:6379
          WEIR_VALKEY_STORM_ADDR: localhost:6380
          WEIR_VALKEY_REPLICA_ADDR: localhost:6381
        run: make test-valkey

  # Keeps a stable required-check name (`check`) however many Go versions the
  # matrix holds.
  check:
    if: always()
    needs: [check-go, caddy-build, valkey]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check-go.result }}" = success -a "${{ needs.caddy-build.result }}" = success -a "${{ needs.valkey.result }}" = success
