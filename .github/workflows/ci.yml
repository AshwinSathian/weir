name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D42: the two latest Go releases at or above the go.mod minimum. Only
        # 1.27 exists today; add the next release here when it ships.
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.mod
            **/go.sum
      - name: make check
        run: make check
      - name: govulncheck
        run: make vuln

  # Keeps a stable required-check name (`check`) however many Go versions the
  # matrix holds.
  check:
    if: always()
    needs: check-go
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check-go.result }}" = success
