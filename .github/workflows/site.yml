name: site

# The website gate. Separate from ci.yml so a Go-only change needs no Node,
# and so a red release-state job cannot hide a green Go build.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "cachestatus.go", "errors.go", "example_test.go", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "README.md", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "cachestatus.go", "errors.go", "example_test.go", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # Style lint, claims register, benchmark data, README program, then the
      # type check and the static build with its internal link check.
      - name: make site-check
        run: make site-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site/out
          retention-days: 7

  # The launch gate (docs/progress/surfaces-and-site-plan.md §10): while the
  # site says v1.0.0 is released, every module must resolve at that version.
  release-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: site/.nvmrc
      - run: node site/scripts/check.mjs release
