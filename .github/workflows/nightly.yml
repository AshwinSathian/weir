name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target (job timeout is 30 minutes)
        default: 5m

permissions:
  contents: read

jobs:
  fuzz-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          cache: true
      - id: list
        name: list fuzz targets
        run: |
          # Root module only: observe/prom and later modules have no fuzz targets yet.
          # A package that does not compile must fail this step, not shrink the matrix.
          go test -run '^$' ./... > /dev/null
          for pkg in $(go list ./...); do
            out="$(go test -list '^Fuzz' "$pkg")"
            for f in $(echo "$out" | grep '^Fuzz' || true); do
              echo "{\"pkg\":\"$pkg\",\"target\":\"$f\"}"
            done
          done | jq -sc '{include: .}' > matrix.json
          test "$(jq '.include | length' matrix.json)" -gt 0
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          cache: true
      - name: fuzz ${{ matrix.target }}
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PKG"
      # A crasher is written under testdata/fuzz/<Target>/ in the package
      # directory. Check it in as a seed together with its fix (docs/07 §5).
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crasher-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/*"
          if-no-files-found: warn

  cache-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: cache-tests against weirproxy
        env:
          CACHE_TESTS_LOGS: ${{ runner.temp }}/cache-tests-logs
        run: scripts/cache-tests.sh
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-tests-logs
          path: ${{ runner.temp }}/cache-tests-logs
          if-no-files-found: warn

  # A standard library fix ships without a commit here, so a pull request
  # never sees it. Running govulncheck daily on the latest patch of each
  # supported release reports a new finding within a day.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: govulncheck
        run: make vuln
