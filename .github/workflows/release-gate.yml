name: release-gate

# docs/07 §12 and docs/release.md: the checks that need hours rather than
# minutes. Run by hand (workflow_dispatch) on the release candidate commit.
# The load scenarios (§9) run on the reference machine, not here.

on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target (docs/07 §12 asks for 1 hour cumulatively)
        default: 60m
      count:
        description: Consecutive runs of the engine-level tests (docs/07 §12 asks for 100)
        default: "100"
      repeat:
        description: Run the repeated-test groups (turn off to rerun only the fuzzing)
        type: boolean
        default: true
      fuzz:
        description: Run the fuzz jobs (turn off to rerun only the repeated tests, which take about 30 minutes)
        type: boolean
        default: true
      pkgs:
        description: Package groups for the repeated tests, a JSON array (default all four)
        default: '[".", "./internal/...", "./store/...", "./weirhttp/..."]'

permissions:
  contents: read

jobs:
  repeat:
    if: inputs.repeat
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # One job per group so none has to fit the whole suite: the root
        # package alone takes about 15 s per race run on a quiet 4-core box.
        pkgs: ${{ fromJSON(inputs.pkgs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
      # -count=N reruns each test N times in one process, shuffled, under the
      # race detector. A single failure fails the job, as §12 requires.
      - name: engine-level tests, repeated
        env:
          COUNT: ${{ inputs.count }}
          PKGS: ${{ matrix.pkgs }}
        run: go test -race -shuffle=on -count="$COUNT" -timeout 230m $PKGS

  fuzz-targets:
    if: inputs.fuzz
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
      - id: list
        name: list fuzz targets
        run: |
          go test -run '^$' ./... > /dev/null
          for pkg in $(go list ./...); do
            out="$(go test -list '^Fuzz' "$pkg")"
            for f in $(echo "$out" | grep '^Fuzz' || true); do
              echo "{\"pkg\":\"$pkg\",\"target\":\"$f\"}"
            done
          done | jq -sc '{include: .}' > matrix.json
          test "$(jq '.include | length' matrix.json)" -gt 0
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  fuzz:
    if: inputs.fuzz
    needs: fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 350 # fuzztime up to about 5 h; GitHub-hosted jobs stop at 6 h
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
      - name: fuzz ${{ matrix.target }}
        env:
          FUZZTIME: ${{ inputs.fuzztime }}
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PKG"
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crasher-${{ strategy.job-index }}-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/*"
          if-no-files-found: warn

  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # latest patch: earlier patches carry stdlib vulnerabilities (govulncheck)
          check-latest: true # the runner cache can hold an older patch with known vulnerabilities
          cache: true
      # NFR-5: the allocation bound holds on any machine; ns/op is judged on
      # the reference machine, so it is printed here and not gated.
      - name: ServeHitSmall allocations
        run: |
          out="$(go test -run '^$' -bench '^BenchmarkServeHitSmall$' -benchmem -count 3 .)"
          echo "$out"
          # Fail closed: a renamed or skipped benchmark prints no line and must not pass.
          echo "$out" | awk '/^BenchmarkServeHitSmall/ { seen++; if ($(NF-1)+0 > 16) { print "allocs/op over 16: " $(NF-1); bad=1 } } END { if (!seen) { print "no BenchmarkServeHitSmall result"; exit 1 } exit bad }'
