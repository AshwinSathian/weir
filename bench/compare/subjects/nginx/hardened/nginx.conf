# Hardened tier (docs/11 §5.3): the default tier plus the settings of
# ngx_http_proxy_module that keep request input out of shared responses.
# Source for every line: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
worker_processes auto;
events { worker_connections 32768; }
http {
    access_log off;
    proxy_cache_path /var/cache/nginx/bench keys_zone=bench:64m max_size=1g;
    server {
        listen 8080 backlog=65535;
        location / {
            proxy_pass http://origin:9000;
            proxy_cache bench;
            # proxy_set_header: "If the value of a header field is an empty
            # string then this field will not be passed to a proxied server".
            # The three headers are in no cache key and an origin may act on
            # them, so they do not reach it.
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Original-URL "";
            proxy_set_header X-HTTP-Method-Override "";
            # proxy_no_cache and proxy_cache_bypass: "If at least one value of
            # the string parameters is not empty and is not equal to 0 then the
            # response will not be saved" (or taken from the cache). The
            # manual's example lists $http_authorization and a cookie; here a
            # request with credentials, any cookie or a body is neither
            # stored nor answered from the cache. $content_length is the
            # request's Content-Length (ngx_http_core_module, variables).
            proxy_no_cache $http_authorization $http_cookie $content_length;
            proxy_cache_bypass $http_authorization $http_cookie $content_length;
        }
    }
}
