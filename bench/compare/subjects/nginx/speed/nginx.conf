# Speed pillar (docs/11 §5.5): the default tier with a 160 MiB cache.
worker_processes auto;
events { worker_connections 32768; }
http {
    access_log off;
    proxy_cache_path /var/cache/nginx/bench keys_zone=bench:64m max_size=160m;
    server {
        listen 8080 backlog=65535;
        location / {
            proxy_pass http://origin:9000;
            proxy_cache bench;
        }
    }
}
