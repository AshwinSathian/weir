# Tuned tier: the stampede controls of ngx_http_proxy_module. The cache lock
# keeps its documented 5 s timeout and age. No max_conns on the upstream:
# open source nginx has no queue for it (the queue directive is commercial),
# so a cap would turn overflow into 502s instead of waiting (docs/11 §3).
worker_processes auto;
events { worker_connections 32768; }
http {
    access_log off;
    proxy_cache_path /var/cache/nginx/bench keys_zone=bench:64m max_size=1g;
    upstream origin_up {
        server origin:9000;
        keepalive 64;
    }
    server {
        listen 8080 backlog=65535;
        location / {
            proxy_pass http://origin_up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache bench;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }
    }
}
