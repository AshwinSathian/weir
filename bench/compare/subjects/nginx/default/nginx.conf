# Default tier: proxy_cache switched on and nothing else. Lifetimes come from
# the origin's Cache-Control. worker_connections and the listen backlog are
# plumbing, raised for every subject (docs/11 §3).
worker_processes auto;
events { worker_connections 32768; }
http {
    access_log off;
    proxy_cache_path /var/cache/nginx/bench keys_zone=bench:64m max_size=1g;
    server {
        listen 8080 backlog=65535;
        location / {
            proxy_pass http://origin:9000;
            proxy_cache bench;
        }
    }
}
