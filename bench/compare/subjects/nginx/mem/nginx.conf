# Memory pillar (docs/11 §5.5): room for a million entries (keys_zone holds
# about 8 000 keys per MiB).
worker_processes auto;
events { worker_connections 32768; }
http {
    access_log off;
    proxy_cache_path /var/cache/nginx/bench keys_zone=bench:256m max_size=4g;
    server {
        listen 8080 backlog=65535;
        location / {
            proxy_pass http://origin:9000;
            proxy_cache bench;
        }
    }
}
